<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="account-area">
        <button id="account-button" type="button" aria-label="Teacher account" aria-expanded="false">
          <span aria-hidden="true">&#128100;</span>
        </button>
        <div id="account-menu" class="account-menu hidden">
          <button id="login-trigger" type="button">Teacher Login</button>
          <button id="logout-button" class="hidden" type="button">Log Out</button>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
      <p id="teacher-message">Teacher sign-in is required to register or remove students.</p>
    </main>

    <div id="login-dialog" class="modal-backdrop hidden" role="presentation">
      <section role="dialog" aria-modal="true" aria-labelledby="login-title">
        <button id="close-login" class="modal-close" type="button" aria-label="Close">&times;</button>
        <h3 id="login-title">Teacher Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" autocomplete="current-password" required />
          </div>
          <button type="submit">Log In</button>
          <p id="login-error" class="error hidden" role="alert"></p>
        </form>
      </section>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
